<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Chatbot — Demo</title>
  <link rel="stylesheet" href="css/demo.css">
</head>
<body>

  <div id="chat-container">
    <div id="chat-header">
      <span class="status-dot"></span>
      <div>
        <h1>Gym Assistant Bot</h1>
        <span class="subtitle">Online — Ask me anything about the gym</span>
      </div>
    </div>

    <div id="chat-messages">
      <!-- Messages rendered here -->
    </div>

    <div id="typing-indicator" class="typing-indicator">
      <span></span><span></span><span></span>
    </div>

    <div id="chat-input-area">
      <button id="mic-btn" title="Hold to talk">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      <button id="camera-btn" title="Scan food for calories">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </button>
      <input type="text" id="chat-input" placeholder="Type, talk 🎤, or scan food 📷..." autocomplete="off">
      <button id="voice-toggle" title="Toggle voice responses">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>
      <button id="send-btn">Send</button>
    </div>
  </div>

  <!-- Camera overlay for food scanning -->
  <div id="camera-overlay" class="camera-overlay">
    <div class="camera-header">
      <h2>📷 Scan Your Food</h2>
      <button id="camera-close" class="camera-close-btn">&times;</button>
    </div>
    <div class="camera-body">
      <video id="camera-feed" autoplay playsinline></video>
      <canvas id="camera-canvas" style="display:none;"></canvas>
      <img id="camera-preview" style="display:none;" />
      <div id="camera-status" class="camera-status">Initializing camera...</div>
    </div>
    <div class="camera-actions">
      <button id="camera-capture" class="camera-action-btn capture">📸 Capture</button>
      <button id="camera-retake" class="camera-action-btn retake" style="display:none;">🔄 Retake</button>
      <button id="camera-analyze" class="camera-action-btn analyze" style="display:none;">🔍 Analyze Calories</button>
      <label id="camera-upload-label" class="camera-action-btn upload">
        📁 Upload Photo
        <input type="file" id="camera-upload" accept="image/*" style="display:none;">
      </label>
    </div>
  </div>

  <button id="debug-toggle">Debug</button>
  <div id="debug-panel"></div>

  <!-- TensorFlow.js + MobileNet (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>

  <!-- Chatbot Engine Scripts (load order matters) -->
  <script src="data/knowledge-base.js"></script>
  <script src="data/food-database.js"></script>
  <script src="js/nlp-engine.js"></script>
  <script src="js/context-manager.js"></script>
  <script src="js/food-analyzer.js"></script>
  <script src="js/gym-chatbot.js"></script>

  <!-- Demo UI (replaceable by your team's frontend) -->
  <script src="js/demo.js"></script>

</body>
</html>
